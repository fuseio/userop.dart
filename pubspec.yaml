name: userop
description: A lightweight Dart library for quickly and easily building ERC-4337
  UserOperations.
version: 0.3.2
homepage: https://fuse.io/sdk
repository: https://github.com/fuseio/userop.dart
issue_tracker: https://github.com/fuseio/userop.dart/issues

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  eth_sig_util: ^0.0.9
  freezed_annotation: ^2.4.4
  http: ^1.2.2
  json_annotation: ^4.9.0
  stream_channel: ^2.1.2
  web3dart: ^3.0.2
  wallet: ^0.0.18

dev_dependencies:
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  lints: ^5.0.0
  test: ^1.25.9
  web3dart_builders:
    git:
      url: git@github.com:AstroxNetwork/web3dart_builders.git
      ref: feat/upgrade-deps

dependency_overrides:
  pointycastle: ^4.0.0
